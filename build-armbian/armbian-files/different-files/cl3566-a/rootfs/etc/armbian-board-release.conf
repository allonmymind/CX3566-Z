# Device-only customization for Touchfly CL3566-A (RK3566).
# Pure server use: no display/touch/LVDS blobs required.
adjust_kernel_files="yes"
adjust_kernel_files_cmd() {
    local env_file="${tag_bootfs}/armbianEnv.txt"
    [ -f "${env_file}" ] || error_msg "CL3566-A: missing armbianEnv.txt"
    grep -q '^initrd_high=' "${env_file}" || printf '\ninitrd_high=0xffffffffffffffff\n' >> "${env_file}"
    grep -q '^fdt_high=' "${env_file}" || printf 'fdt_high=0xffffffffffffffff\n' >> "${env_file}"
    # Enable serial getty on the debug UART (uart2 = ttyS2, 1500000)
    local units="${tag_rootfs}/etc/systemd/system"
    mkdir -p "${units}/getty.target.wants"
    ln -sf /usr/lib/systemd/system/serial-getty@.service "${units}/getty.target.wants/serial-getty@ttyS2.service"

    # USB power fix: the upstream DTB relies on vendor-private driver
    # "jawest,jawest-ctrl-z" (absent in ophub kernel) to pull the USB VBUS/HUB
    # power GPIOs high. Our fixed DTB uses gpio-hog on GPIO122-125 instead.
    # replace_kernel() re-extracts kernel DTBs into bootfs AFTER copy_files(),
    # so re-install the fixed DTB here (this hook runs at the end of replace_kernel).
    local fixed_dtb="${tag_rootfs}/usr/share/cl3566-a/rk3566-cl3566-a.dtb"
    local boot_dtb="${tag_bootfs}/dtb/rockchip/rk3566-cl3566-a.dtb"
    if [ -f "${fixed_dtb}" ]; then
        cp -f "${fixed_dtb}" "${boot_dtb}"
        echo "CL3566-A: installed USB power gpio-hog DTB into ${boot_dtb}"
    else
        echo "CL3566-A: WARNING fixed DTB not found at ${fixed_dtb}"
    fi
}
