# cl3566-a: hard-disable factory aic8800 WiFi.
# The factory aic8800_bsp.ko carries alias=sdio:c07v*d*, so udev modprobes
# it on SDIO card detection regardless of modules-load.d. Under our kernel
# its SDIO RX thread (aicwf_sdio_busrx_thread -> aicwf_process_rxframes)
# leaks skbs and OOM-panics ~80s into boot. Block alias AND direct load.
blacklist aic8800_bsp
blacklist aic8800_fdrv
blacklist aic8800_btlpm
install aic8800_bsp /bin/false
install aic8800_fdrv /bin/false
install aic8800_btlpm /bin/false
