# AIC8800DC: the aic8800_sdio_bsp.ko built from the ophub 6.1.118 tree
# stack-corrupts (__stack_chk_fail in aicbt_patch_trap_data_load) while parsing
# the vendor v1.8.1.2 8800dc_u02 firmware, panicking the kernel during boot.
# Blacklist until a driver matching the vendor firmware is packaged.
blacklist aic8800_sdio_bsp
blacklist aic8800_sdio_btlpm
blacklist aic8800_sdio_fdrv
